<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine</title>
  <style>
    :root{
      --turq:#34d5d5;
      --card:#ffffffd6;
      --shadow: 0 18px 50px rgba(0,0,0,.12);
      --radius: 28px;
      --btnRadius: 999px;
      --font: Arial, Helvetica, sans-serif;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: var(--font);
      overflow:hidden;
      background:
        radial-gradient(1000px 700px at 20% 20%, rgba(255,255,255,.7), transparent 60%),
        linear-gradient(135deg, var(--turq) 0%, #ffffff 70%);
      position: relative;
    }

    /* Blurry overlay */
    body::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        radial-gradient(600px 400px at 70% 30%, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(700px 500px at 20% 80%, rgba(255,255,255,.55), transparent 60%),
        linear-gradient(135deg, rgba(52,213,213,.65) 0%, rgba(255,255,255,.8) 70%);
      filter: blur(18px);
      z-index:0;
    }

    /* Confetti canvas sits on top of everything */
    #confetti{
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card{
      width:min(820px, 92vw);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 46px 28px 40px;
      text-align:center;
      position: relative;
      z-index:1;
      backdrop-filter: blur(10px);
    }

    .pig-wrap{
      width: 140px;
      height: 90px;
      margin: -78px auto 18px;
      display:grid;
      place-items:center;
    }

    /* Cute pig nose (pure CSS) */
    .pig-nose{
      width: 130px;
      height: 78px;
      border-radius: 60px;
      background: #ff9bb0;
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      position: relative;
      border: 4px solid #ff7f9b;
      transform-origin: 50% 60%;
      animation: idleBounce 2.2s ease-in-out infinite;
    }
    .pig-nose::before,
    .pig-nose::after{
      content:"";
      position:absolute;
      top: 18px;
      width: 26px;
      height: 34px;
      border-radius: 999px;
      background:#cc4662;
      opacity:.9;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.2);
    }
    .pig-nose::before{ left: 28px; }
    .pig-nose::after{ right: 28px; }

    /* gentle bounce */
    @keyframes idleBounce{
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-6px) scale(1.01); }
    }

    /* wiggle when "Yes" clicked */
    .pig-nose.wiggle{
      animation: wiggle .55s ease-in-out 1;
    }
    @keyframes wiggle{
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(-10deg) scale(1.02); }
      40%  { transform: rotate(10deg) scale(1.02); }
      60%  { transform: rotate(-8deg) scale(1.02); }
      80%  { transform: rotate(8deg) scale(1.02); }
      100% { transform: rotate(0deg) scale(1); }
    }

    h1{
      margin: 10px 0 30px;
      font-size: clamp(26px, 3.2vw, 40px);
      font-weight: 800;
      color:#2f3a40;
      letter-spacing: .2px;
    }

    .btn-row{
      display:flex;
      justify-content:center;
      gap: 26px;
      flex-wrap:wrap;
      margin-top: 8px;
      position: relative;
      min-height: 84px;
    }

    button{
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 26px;
      font-weight: 800;
      padding: 18px 46px;
      border-radius: var(--btnRadius);
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      transition: transform .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      background: linear-gradient(180deg, #20d6c9, #0fb2a8);
      color: #ffffff;
    }

    #noBtn{
      background: #cfd6db;
      color: #ffffff;
      position: absolute;
      left: 50%;
      transform: translateX(90px);
    }

    .msg{
      margin-top: 18px;
      font-weight: 700;
      color:#2f3a40;
      font-size: 18px;
      min-height: 22px;
    }
  </style>
</head>
<body>

    <div class="pig-wrap" aria-hidden="true">
      <div class="pig-nose" id="pigNose"></div>
    </div>

    <h1><b>Chagiii will you be my valentine</b></h1>

    <div class="btn-row" id="arena">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

      noBtn.style.top  = y + "px";
