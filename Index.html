<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine</title>
  <style>
    :root{
      --turq:#34d5d5;
      --turq2:#bff6f6;
      --card:#ffffffd6;
      --shadow: 0 18px 50px rgba(0,0,0,.12);
      --radius: 28px;
      --btnRadius: 999px;
      --font: Arial, Helvetica, sans-serif;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: var(--font);
      overflow:hidden;
      background:
        radial-gradient(1000px 700px at 20% 20%, rgba(255,255,255,.7), transparent 60%),
        linear-gradient(135deg, var(--turq) 0%, #ffffff 70%);
      position: relative;
    }

    /* Blurry overlay */
    body::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        radial-gradient(600px 400px at 70% 30%, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(700px 500px at 20% 80%, rgba(255,255,255,.55), transparent 60%),
        linear-gradient(135deg, rgba(52,213,213,.65) 0%, rgba(255,255,255,.8) 70%);
      filter: blur(18px);
      z-index:0;
    }

    .card{
      width:min(820px, 92vw);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 46px 28px 40px;
      text-align:center;
      position: relative;
      z-index:1;
      backdrop-filter: blur(10px);
    }

    .pig-wrap{
      width: 140px;
      height: 90px;
      margin: -78px auto 18px;
      display:grid;
      place-items:center;
    }

    /* Cute pig nose (pure CSS) */
    .pig-nose{
      width: 130px;
      height: 78px;
      border-radius: 60px;
      background: #ff9bb0;
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      position: relative;
      border: 4px solid #ff7f9b;
    }
    .pig-nose::before,
    .pig-nose::after{
      content:"";
      position:absolute;
      top: 18px;
      width: 26px;
      height: 34px;
      border-radius: 999px;
      background:#cc4662;
      opacity:.9;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.2);
    }
    .pig-nose::before{ left: 28px; }
    .pig-nose::after{ right: 28px; }

    h1{
      margin: 10px 0 30px;
      font-size: clamp(26px, 3.2vw, 40px);
      font-weight: 800;
      color:#2f3a40;
      letter-spacing: .2px;
    }

    .btn-row{
      display:flex;
      justify-content:center;
      gap: 26px;
      flex-wrap:wrap;
      margin-top: 8px;
      position: relative;
      min-height: 84px;
    }

    button{
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 26px;
      font-weight: 800;
      padding: 18px 46px;
      border-radius: var(--btnRadius);
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      transition: transform .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      background: linear-gradient(180deg, #20d6c9, #0fb2a8);
      color: #ffffff;
    }

    /* The dodgy one */
    #noBtn{
      background: #cfd6db;
      color: #ffffff;
      position: absolute; /* allows moving around */
      left: 50%;
      transform: translateX(90px); /* starts to the right of center */
    }

    .msg{
      margin-top: 18px;
      font-weight: 700;
      color:#2f3a40;
      font-size: 18px;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="pig-wrap" aria-hidden="true">
      <div class="pig-nose"></div>
    </div>

    <h1><b>Chagiii will you be my valentine</b></h1>

    <div class="btn-row" id="arena">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const msg = document.getElementById("msg");

    // Place "No" nicely on load
    function placeNoInitial(){
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const y = (a.height - b.height) / 2;
      const x = (a.width / 2) + 70; // right side
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Random move inside arena bounds
    function moveNo(){
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const padding = 8;
      const maxX = a.width - b.width - padding;
      const maxY = a.height - b.height - padding;

      const x = Math.max(padding, Math.floor(Math.random() * maxX));
      const y = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Make it hard to click: dodge when mouse gets close
    function dodge(e){
      // Only dodge if the pointer is within ~90px
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = (e.clientX ?? (e.touches?.[0]?.clientX)) - cx;
      const dy = (e.clientY ?? (e.touches?.[0]?.clientY)) - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 90) moveNo();
    }

    // Desktop
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("mousemove", dodge);

    // Mobile: move when someone tries to tap near it
    arena.addEventListener("touchstart", (e) => {
      // if touch is on/near the No button, move it
      const touch = e.touches[0];
      const rect = noBtn.getBoundingClientRect();
      const near =
        touch.clientX >= rect.left - 40 &&
        touch.clientX <= rect.right + 40 &&
        touch.clientY >= rect.top - 40 &&
        touch.clientY <= rect.bottom + 40;
      if (near) moveNo();
    }, { passive: true });

    // If they manage to click No somehow, still move it
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNo();
    });

    yesBtn.addEventListener("click", () => {
      msg.textContent = "Yayyyy 💖";
      // Optional: disable buttons after yes
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.opacity = "0.9";
      yesBtn.style.cursor = "default";
    });

    window.addEventListener("resize", placeNoInitial);
    window.addEventListener("load", placeNoInitial);
  </script>
</body>
</html>
